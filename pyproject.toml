[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sap-incident-lab"
version = "0.2.0"
description = "Local MCP server that lets Claude Desktop investigate SAP incidents using a local Qwen model through Ollama"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Bruce Hoppe" }]
dependencies = [
  "mcp>=2.0.0,<3",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
sap-incident-lab = "sap_incident_lab.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_incident_lab"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "windows_only: requires Windows-specific filesystem behavior (junctions, ADS)",
  "live_ollama: opt-in test that calls a real local Ollama instance",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
