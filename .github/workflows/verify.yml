name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests scripts/consumer-check.py
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - name: PowerShell setup control flow
        shell: pwsh
        run: ./tests/windows/setup-script.Tests.ps1
      - run: uv build
      - name: Fresh wheel installation and stdio MCP
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          uv run --locked python scripts/consumer-check.py $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
